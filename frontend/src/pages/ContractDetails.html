<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LegalLens — Contract Details</title>
<link rel="stylesheet" href="../css/main.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main-col">
    <div id="topbar-slot"></div>
    <main class="content">
      <div class="page-head">
        <span class="eyebrow">Case file</span>
        <h1>Contract Details</h1>
      </div>

      <div id="details-root">
        <div class="loading-row"><div class="spinner"></div></div>
      </div>
    </main>
  </div>
</div>

<!-- Clause edit modal -->
<div class="modal-backdrop" id="clause-modal-backdrop">
  <div class="modal">
    <h3>Edit Clause</h3>
    <form id="clause-form">
      <div class="form-row">
        <label for="clauseType">Clause Type</label>
        <select class="form-control" id="clauseType">
          <option>Payment Terms</option>
          <option>Confidentiality</option>
          <option>Termination</option>
          <option>Limitation of Liability</option>
          <option>Renewal</option>
        </select>
      </div>
      <div class="form-row">
        <label for="clauseRisk">Risk Level</label>
        <select class="form-control" id="clauseRisk">
          <option>LOW</option>
          <option>MEDIUM</option>
          <option>HIGH</option>
        </select>
      </div>
      <div class="form-row">
        <label for="clauseContent">Content</label>
        <textarea class="form-control" id="clauseContent"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="clause-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Clause</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
<script src="../store/authStore.js"></script>
<script src="../services/api.js"></script>
<script src="../services/contractService.js"></script>
<script src="../services/clauseService.js"></script>
<script src="../services/commentService.js"></script>
<script src="../services/complianceService.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/render-helpers.js"></script>
<script src="../layout/MainLayout.js"></script>
<script src="./ContractDetails.js"></script>
</body>
</html>
