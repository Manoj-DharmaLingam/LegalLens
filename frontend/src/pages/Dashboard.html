<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LegalLens — Dashboard</title>
<link rel="stylesheet" href="../css/main.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main-col">
    <div id="topbar-slot"></div>
    <main class="content">
      <div class="page-head">
        <span class="eyebrow" id="dash-eyebrow">Overview</span>
        <h1 id="dash-title">Contract Compliance Dashboard</h1>
        <p id="dash-subtitle">A running record of every filing and its standing.</p>
      </div>

      <div class="grid grid-3" id="stat-cards" style="margin-bottom:24px;"></div>

      <div class="card">
        <div class="card-head">
          <h3>Recent Activity</h3>
        </div>
        <div id="dash-table-wrap">
          <div class="loading-row"><div class="spinner"></div></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
<script src="../store/authStore.js"></script>
<script src="../services/api.js"></script>
<script src="../services/contractService.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/render-helpers.js"></script>
<script src="../layout/MainLayout.js"></script>
<script src="./Dashboard.js"></script>
</body>
</html>
