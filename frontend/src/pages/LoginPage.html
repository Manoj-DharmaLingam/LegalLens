<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LegalLens — Log in</title>
<link rel="stylesheet" href="../css/main.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">LL</div>
      <h1>LegalLens</h1>
      <p>Contract Clause &amp; Compliance Analyzer</p>
    </div>

    <form id="login-form" novalidate>
      <div class="form-row" id="row-username">
        <label for="username">Username</label>
        <input class="form-control" type="text" id="username" name="username" placeholder="Username" autocomplete="username">
        <div class="form-error">Username is required</div>
      </div>

      <div class="form-row" id="row-password">
        <label for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" placeholder="Password" autocomplete="current-password">
        <div class="form-error">Password is required</div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log in</button>
    </form>

    <div class="auth-foot">
      New to LegalLens? <a href="./RegisterPage.html" class="link-inline">register now!</a>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
<script src="../store/authStore.js"></script>
<script src="../services/api.js"></script>
<script src="../services/authService.js"></script>
<script src="../js/toast.js"></script>
<script src="./LoginPage.js"></script>
</body>
</html>
